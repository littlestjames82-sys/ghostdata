[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdata"
version = "0.1.0"
description = "Structured data slicer for GhostSlice: schema inference plus a bounded, redacted sample pack for CSV, TSV, JSON arrays, and JSONL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ghostdata = "ghostdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
